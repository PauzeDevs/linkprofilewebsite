<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8c8ff">
  <meta name="description" content="Pauze's links: personal website, projects, GitHub, and Instagram.">
  <title>Pauze — links</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#24202c;
      --muted:#77717f;
      --paper:#eee9f7;
      --line:#ffffff;
      --focus:#6d35dc;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--paper); }
    body {
      min-height:100vh;
      margin:0;
      background:linear-gradient(145deg,#f7f1ff 0%,#efe9f8 48%,#f9e9ee 100%);
      color:var(--ink);
      font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main { width:min(560px,calc(100% - 36px)); min-height:100vh; margin:0 auto; padding:62px 0 25px; display:flex; flex-direction:column; align-items:center; }
    .profile { width:100%; text-align:center; }
    .avatar { width:96px; height:96px; margin:0 auto 20px; overflow:hidden; border:4px solid #fff; border-radius:50%; background:#ddd0f6; box-shadow:0 7px 20px #43236f20; }
    .avatar img { display:block; width:100%; height:100%; object-fit:cover; }
    .eyebrow { color:#6e6579; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:9px 0 8px; font:750 clamp(34px,8vw,43px)/1.08 Inter,"Avenir Next",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.05em; }
    .bio { max-width:400px; margin:0 auto; color:var(--muted); font-size:14px; }
    .links { width:100%; display:grid; gap:13px; margin-top:30px; }
    .link {
      display:grid;
      grid-template-columns:40px minmax(0,1fr) 40px;
      align-items:center;
      min-height:68px;
      padding:11px 15px;
      border:2px solid #fff;
      border-radius:18px;
      background:#fff;
      color:#2a2433;
      text-decoration:none;
      box-shadow:0 5px 13px #4b345717;
      transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    }
    .link:hover { transform:translateY(-2px); box-shadow:0 10px 22px #4b345725; background:#fcfaff; }
    .link:active { transform:translateY(0); }
    .link-icon { display:grid; width:38px; height:38px; place-items:center; border-radius:13px; background:#f0eafb; color:#5734a2; }
    .link-github .link-icon { color:#25222b; background:#f0eff2; }
    .link-instagram .link-icon { color:#d94b8a; background:#fff0f6; }
    .link-pauzex .link-icon { background:transparent; color:#633fd0; }
    .pauzex-mark { font-size:13px; font-weight:850; letter-spacing:-.12em; line-height:1; white-space:nowrap; }
    .link-website .link-icon { color:#6c38d5; background:#eee6ff; }
    .link-icon svg { display:block; width:20px; height:20px; }
    .link-icon img { display:block; width:30px; height:30px; border-radius:5px; object-fit:contain; }
    .link-copy { min-width:0; text-align:center; }
    .link-name { display:block; font-size:14px; font-weight:700; }
    .link-detail { display:block; overflow:hidden; color:#827b89; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .link-arrow { justify-self:end; padding-right:3px; color:#8d8498; font-size:17px; transition:transform .18s ease; }
    .link:hover .link-arrow { transform:translate(2px,-2px); }
    footer { width:100%; margin-top:auto; padding-top:38px; color:#807888; font-size:10px; letter-spacing:.12em; text-align:center; text-transform:uppercase; }
    a:focus-visible { outline:3px solid var(--focus); outline-offset:4px; }
    @media (max-width:520px) { main { padding-top:48px; } .links { gap:11px; margin-top:26px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <div class="avatar"><img src="https://avatars.githubusercontent.com/u/324624272?v=4" alt="" width="92" height="92"></div>
      <div class="eyebrow">Independent developer · India</div>
      <h1>Hey, I’m Pauze.</h1>
      <p class="bio">Building web apps, Android tools, and curious experiments. Find my work and follow along.</p>
    </header>

    <nav class="links" aria-label="Pauze's links" id="links"></nav>

    <footer>© 2026 Pauze · Thanks for stopping by.</footer>
  </main>
  <script>
    const icons = {
      github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297a12 12 0 0 0-3.797 23.4c.6.113.82-.258.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.467-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.552 3.297-1.23 3.297-1.23.655 1.652.243 2.873.12 3.176.77.84 1.233 1.911 1.233 3.22 0 4.61-2.804 5.625-5.476 5.92.43.37.814 1.102.814 2.222v3.293c0 .322.216.694.825.576A12.005 12.005 0 0 0 12 .297z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="6.6" r="1.1" fill="currentColor"/></svg>',
      pauzex: '<span class="pauzex-mark">PX</span>',
      website: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" stroke="currentColor" stroke-width="1.5"/></svg>'
    };
    const links = [
      { name: "Main website", detail: "pauze.is-a.dev", url: "https://pauze.is-a.dev", icon: "website" },
      { name: "PauzeX Developments", detail: "pauzex.devs.surf", url: "https://pauzex.devs.surf", icon: "pauzex" },
      { name: "GitHub", detail: "@PauzeDevs", url: "https://github.com/PauzeDevs", icon: "github" },
      { name: "Instagram", detail: "@pauze.wav", url: "https://instagram.com/pauze.wav", icon: "instagram" }
    ];

    const list = document.querySelector("#links");
    for (const item of links) {
      const link = document.createElement("a");
      link.className = "link link-" + item.icon;
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.innerHTML = '<span class="link-icon" aria-hidden="true"></span><span class="link-copy"><span class="link-name"></span><span class="link-detail"></span></span><span class="link-arrow" aria-hidden="true">↗</span>';
      link.querySelector(".link-icon").innerHTML = icons[item.icon] || "";
      link.querySelector(".link-name").textContent = item.name;
      link.querySelector(".link-detail").textContent = item.detail;
      list.append(link);
    }


  </script>
</body>
</html>
