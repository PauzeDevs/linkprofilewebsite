<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Pauze Devs' profiles, links, and projects.">
  <title>Pauze Devs — links and projects</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #72776f;
      --paper: #f5f3ee;
      --card: #fffefa;
      --line: #e8e5dc;
      --green: #345844;
      --soft-green: #eef1e7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 15% 8%, #e6ebd7 0, transparent 32rem), var(--paper);
      color: var(--ink);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 36px; }
    .topline { display:flex; align-items:center; gap:10px; color:var(--green); font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    .dot { width:8px; height:8px; background:#87a469; border-radius:50%; box-shadow:0 0 0 4px #87a46922; }
    .identity { display:flex; align-items:center; gap:18px; margin-top:28px; }
    .avatar { display:grid; place-items:center; flex:0 0 68px; width:68px; height:68px; border:1px solid #dce3d1; border-radius:22px; background:var(--soft-green); color:var(--green); font:700 22px/1 Georgia,serif; letter-spacing:-.06em; }
    h1 { margin:0; font:500 clamp(42px, 9vw, 64px)/.98 Georgia, "Times New Roman", serif; letter-spacing:-.055em; }
    .bio { max-width:460px; margin:17px 0 0; color:var(--muted); font-size:17px; }
    .section-title { display:flex; align-items:center; gap:12px; margin:37px 0 14px; color:#74796f; font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
    .section-title:after { content:""; height:1px; flex:1; background:var(--line); }
    .profiles { display:grid; gap:11px; }
    .profile, .project {
      display:flex; align-items:center; gap:15px; padding:14px 16px;
      border:1px solid var(--line); border-radius:16px; background:var(--card);
      color:inherit; text-decoration:none; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .profile:hover, .project:hover { transform:translateY(-2px); border-color:#b6c4ad; box-shadow:0 10px 28px #28362c0d; }
    .icon { display:grid; place-items:center; flex:0 0 43px; width:43px; height:43px; border-radius:13px; background:var(--soft-green); color:var(--green); font-size:15px; font-weight:750; }
    .details { min-width:0; flex:1; }
    .name { display:block; font-weight:700; }
    .handle { display:block; overflow:hidden; color:var(--muted); font-size:13px; text-overflow:ellipsis; white-space:nowrap; }
    .arrow { color:var(--green); font-size:20px; }
    .project { align-items:flex-start; }
    .project .icon { font-size:20px; }
    footer { display:flex; justify-content:space-between; gap:16px; margin-top:40px; padding-top:17px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    footer a { color:var(--green); text-decoration:none; }
    a:focus-visible { outline:3px solid #8ba16e; outline-offset:3px; }
    @media (max-width:520px) { main { padding-top:50px; } footer { flex-direction:column; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="topline"><span class="dot" aria-hidden="true"></span> Personal links</div>
    <header>
      <div class="identity">
        <div class="avatar" aria-hidden="true">PD</div>
        <h1>Pauze Devs</h1>
      </div>
      <p class="bio">Developer exploring new ideas and sharing projects.</p>
    </header>

    <div class="section-title">Find me online</div>
    <nav class="profiles" aria-label="Pauze Devs profiles" id="profiles"></nav>

    <div class="section-title">Featured project</div>
    <a class="project" href="https://github.com/PauzeDevs/linkprofilewebsite" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">↗</span>
      <span class="details"><span class="name">Link Profile Website</span><span class="handle">A home for my profiles and projects</span></span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <footer><span>Thanks for stopping by.</span><a href="https://github.com/PauzeDevs" target="_blank" rel="noopener noreferrer">GitHub · @PauzeDevs ↗</a></footer>
  </main>
  <script>
    // Add each profile as { name, handle, url, icon }.
    const profiles = [
      { name: "GitHub", handle: "@PauzeDevs", url: "https://github.com/PauzeDevs", icon: "GH" },
      { name: "Instagram", handle: "@pauze.wav", url: "https://instagram.com/pauze.wav", icon: "IG" }
    ];

    const list = document.querySelector("#profiles");
    for (const profile of profiles) {
      const link = document.createElement("a");
      link.className = "profile";
      link.href = profile.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.innerHTML = '<span class="icon" aria-hidden="true"></span><span class="details"><span class="name"></span><span class="handle"></span></span><span class="arrow" aria-hidden="true">↗</span>';
      link.querySelector(".icon").textContent = profile.icon;
      link.querySelector(".name").textContent = profile.name;
      link.querySelector(".handle").textContent = profile.handle;
      list.append(link);
    }
  </script>
</body>
</html>
