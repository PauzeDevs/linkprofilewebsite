<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a10">
  <meta name="description" content="Pauze's links: personal website, projects, GitHub, and Instagram.">
  <title>Pauze — links</title>
  <style>
    :root {
      color-scheme: dark;
      --ink:#f3f1ec;
      --muted:#a3a3ad;
      --paper:#090a10;
      --line:#ffffff1b;
      --focus:#d6d4ca;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--paper); }
    body {
      position:relative;
      isolation:isolate;
      min-height:100vh;
      margin:0;
      background:radial-gradient(ellipse at 50% 24%,#151725 0,transparent 54rem),linear-gradient(180deg,#0c0d15 0%,#090a10 72%,#08090e 100%);
      color:var(--ink);
      font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    #starfield { position:fixed; inset:0; z-index:-1; width:100%; height:100%; pointer-events:none; }
    main { width:min(540px,calc(100% - 36px)); min-height:100vh; margin:0 auto; padding:64px 0 26px; display:flex; flex-direction:column; align-items:center; }
    .profile { width:100%; text-align:center; }
    .avatar { width:92px; height:92px; margin:0 auto 22px; overflow:hidden; border:1px solid #ffffff35; border-radius:50%; background:#171923; box-shadow:0 0 36px #b7c4ff18; }
    .avatar img { display:block; width:100%; height:100%; object-fit:cover; }
    .eyebrow { color:#bbbcc4; font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:10px 0 10px; font:650 clamp(36px,8vw,48px)/1.05 Inter,"Avenir Next",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; letter-spacing:-.045em; }
    .bio { max-width:410px; margin:0 auto; color:var(--muted); font-size:14px; }
    .links { width:100%; display:grid; gap:12px; margin-top:32px; }
    .link {
      display:grid;
      grid-template-columns:40px minmax(0,1fr) 40px;
      align-items:center;
      min-height:66px;
      padding:10px 13px;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(110deg,#171923eF,#11131bed);
      color:var(--ink);
      text-decoration:none;
      backdrop-filter:blur(10px);
      transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease;
    }
    .link:hover { transform:translateY(-2px); border-color:#ffffff48; background:#1c1e29f2; box-shadow:0 10px 32px #0005,0 0 25px #b7c4ff0a; }
    .link:active { transform:translateY(0); }
    .link-icon { display:grid; width:38px; height:38px; place-items:center; border:1px solid #ffffff17; border-radius:11px; background:#ffffff08; color:#e8e6df; }
    .link-icon svg { display:block; width:20px; height:20px; }
    .link-icon img { display:block; width:25px; height:25px; border-radius:5px; object-fit:contain; }
    .link-copy { min-width:0; text-align:center; }
    .link-name { display:block; font-size:14px; font-weight:650; }
    .link-detail { display:block; overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .link-arrow { justify-self:end; padding-right:3px; color:#a7a8b2; font-size:17px; transition:transform .18s ease; }
    .link:hover .link-arrow { transform:translate(2px,-2px); }
    footer { width:100%; margin-top:auto; padding-top:40px; color:#747681; font-size:10px; letter-spacing:.12em; text-align:center; text-transform:uppercase; }
    a:focus-visible { outline:2px solid var(--focus); outline-offset:4px; }
    @media (max-width:520px) { main { padding-top:52px; } .links { gap:10px; margin-top:28px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <main>
    <header class="profile">
      <div class="avatar"><img src="https://avatars.githubusercontent.com/u/324624272?v=4" alt="" width="92" height="92"></div>
      <div class="eyebrow">Independent developer · India</div>
      <h1>Hey, I’m Pauze.</h1>
      <p class="bio">Building web apps, Android tools, and curious experiments. Find my work and follow along.</p>
    </header>

    <nav class="links" aria-label="Pauze's links" id="links"></nav>

    <footer>Made with curiosity · 2026</footer>
  </main>
  <script>
    const icons = {
      github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .297a12 12 0 0 0-3.797 23.4c.6.113.82-.258.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.467-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.552 3.297-1.23 3.297-1.23.655 1.652.243 2.873.12 3.176.77.84 1.233 1.911 1.233 3.22 0 4.61-2.804 5.625-5.476 5.92.43.37.814 1.102.814 2.222v3.293c0 .322.216.694.825.576A12.005 12.005 0 0 0 12 .297z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><circle cx="17.5" cy="6.6" r="1.1" fill="currentColor"/></svg>',
      pauzex: '<img src="https://raw.githubusercontent.com/PauzeDevs/PauzeXDevelopments-Website/main/assets/pauzex-logo.webp" alt="" width="25" height="25">',
      website: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" stroke="currentColor" stroke-width="1.5"/></svg>'
    };
    const links = [
      { name: "Main website", detail: "pauze.is-a.dev", url: "https://pauze.is-a.dev", icon: "website" },
      { name: "PauzeX Developments", detail: "pauzex.devs.surf", url: "https://pauzex.devs.surf", icon: "pauzex" },
      { name: "GitHub", detail: "@PauzeDevs", url: "https://github.com/PauzeDevs", icon: "github" },
      { name: "Instagram", detail: "@pauze.wav", url: "https://instagram.com/pauze.wav", icon: "instagram" }
    ];

    const list = document.querySelector("#links");
    for (const item of links) {
      const link = document.createElement("a");
      link.className = "link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.innerHTML = '<span class="link-icon" aria-hidden="true"></span><span class="link-copy"><span class="link-name"></span><span class="link-detail"></span></span><span class="link-arrow" aria-hidden="true">↗</span>';
      link.querySelector(".link-icon").innerHTML = icons[item.icon] || "";
      link.querySelector(".link-name").textContent = item.name;
      link.querySelector(".link-detail").textContent = item.detail;
      list.append(link);
    }

    const canvas = document.querySelector("#starfield");
    const context = canvas.getContext("2d");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let width = 0;
    let height = 0;
    let stars = [];

    function resizeStarfield() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      const count = Math.min(700, Math.max(180, Math.round(width * height / 1900)));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() < 0.96 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.2 + 0.8,
        phase: Math.random() * Math.PI * 2,
        pace: Math.random() * 0.018 + 0.004,
        drift: Math.random() * 0.12 + 0.015
      }));
      drawStarfield(0);
    }

    function drawStarfield(time) {
      context.clearRect(0, 0, width, height);
      for (const star of stars) {
        const shimmer = reduceMotion ? 0.65 : 0.28 + (Math.sin(time * star.pace + star.phase) + 1) * 0.3;
        context.beginPath();
        context.fillStyle = "rgba(224, 229, 245, " + shimmer.toFixed(3) + ")";
        context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        context.fill();
        if (!reduceMotion) {
          star.y -= star.drift;
          if (star.y < -2) {
            star.y = height + 2;
            star.x = Math.random() * width;
          }
        }
      }
      if (!reduceMotion) window.requestAnimationFrame(drawStarfield);
    }

    window.addEventListener("resize", resizeStarfield, { passive: true });
    resizeStarfield();
  </script>
</body>
</html>
